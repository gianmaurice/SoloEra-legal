<style>
:root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1a1a; --muted: #5a5a60; --line: #dcdcdc; --link: #0a5c8f; --code: #f2f2f2; }
@media (prefers-color-scheme: dark) { :root { --bg: #050506; --fg: #f2f0eb; --muted: #a8a8ae; --line: #2a2a2e; --link: #9be8d8; --code: #131316; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding: 0 20px 64px; background: var(--bg); color: var(--fg); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

p, li { margin: 0 0 0.9em; }
ul { padding-left: 1.3em; }
a { color: var(--link); }
code { font: 0.92em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); padding: 0.1em 0.3em; border-radius: 4px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
table { border-collapse: collapse; width: 100%; margin: 0 0 1.2em; font-size: 0.95em; }
th, td { text-align: left; vertical-align: top; padding: 0.55em 0.6em; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; }
.updated { color: var(--muted); }
nav.top { margin: 1.6em 0 0; font-size: 0.95em; color: var(--muted); }
nav.top a { margin-right: 1em; }
footer { margin-top: 3em; padding-top: 1em; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.9em; }
@media (max-width: 480px) { body { font-size: 16px; padding: 0 16px 48px; } table, thead, tbody, tr { display: block; } thead { display: none; } td { display: block; border-bottom: 0; padding: 0.3em 0; } tr { padding: 0.6em 0; border-bottom: 1px solid var(--line); } td:first-child { font-weight: 600; } }
</style>
